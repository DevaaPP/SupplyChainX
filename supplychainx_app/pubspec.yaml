name: supplychainx_app
description: SupplyChainX — AI-Powered Smart Supply Chain & Product Traceability Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP client
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Secure local storage
  flutter_secure_storage: ^9.2.2

  # Biometric auth
  local_auth: ^2.2.0

  # QR code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Crypto / security
  crypto: ^3.0.3
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  otp: ^3.1.4

  # JWT
  jwt_decoder: ^2.0.1

  # UI & Fonts
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Charts
  fl_chart: ^0.68.0

  # Image & QR (web compat)
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  share_plus: ^9.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  timeago: ^3.6.1

  # Icons
  hugeicons: ^0.0.7
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

