org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Disable Kotlin incremental compilation to fix cross-drive (C: vs D:) relative path crash on Windows
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false
kotlin.incremental.useClasspathSnapshot=false

# Disable R8 full mode so reflection-based ML Kit and CameraX components are not stripped in release mode
android.enableR8.fullMode=false
