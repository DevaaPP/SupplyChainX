  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #1E293B 0%, #0F172A 70%, #090E17 100%);
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }
    .brand-mark {
      position: relative;
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .brand-glow {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(237, 219, 67, 0.25) 0%, rgba(237, 219, 67, 0) 70%);
      animation: pulseGlow 2.4s ease-in-out infinite;
    }
    .brand-hexagon {
      width: 60px;
      height: 60px;
      background: #EDDB43;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(237, 219, 67, 0.25);
      position: relative;
      z-index: 2;
    }
    .brand-hexagon svg {
      width: 34px;
      height: 34px;
    }
    .brand-title {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin: 0 0 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      background: rgba(237, 219, 67, 0.15);
      border: 1px solid rgba(237, 219, 67, 0.4);
      color: #EDDB43;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .brand-subtitle {
      color: #94A3B8;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin: 0 0 28px 0;
    }
    .progress-track {
      width: 220px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 35%;
      background: #EDDB43;
      border-radius: 2px;
      animation: progressMove 1.6s ease-in-out infinite;
    }
    .telemetry-status {
      margin-top: 14px;
      color: #94A3B8;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      letter-spacing: 0.2px;
      transition: opacity 0.3s ease;
    }
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    @keyframes progressMove {
      0% { left: -35%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="brand-mark">
      <div class="brand-glow"></div>
      <div class="brand-hexagon">
        <!-- Isometric Express Delivery Package Icon -->
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 6L40 15V33L24 42L8 33V15L24 6Z" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M24 6V24M24 24L40 15M24 24L8 15" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M24 24V42" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M16 28.5L24 33L32 28.5" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div class="brand-title">
      SupplyChainX
      <span class="brand-badge">EXPRESS LOGISTICS</span>
    </div>
    <div class="brand-subtitle">Global Freight & Smart Delivery Network</div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
    <div id="status-text" class="telemetry-status">Connecting to Global Logistics Network...</div>
  </div>

  <script>
    // Commercial Logistics Status Progression
    (function() {
      var steps = [
        "Connecting to Global Logistics Network...",
        "Syncing Active Freight Routes & Fleet Telemetry...",
        "Verifying Consignment Dispatch & Delivery Hubs...",
        "Dispatch Operations Portal Ready."
      ];
      var idx = 0;
      var statusEl = document.getElementById('status-text');
      var interval = setInterval(function() {
        if (!statusEl) { clearInterval(interval); return; }
        idx = (idx + 1) % steps.length;
        statusEl.style.opacity = '0';
        setTimeout(function() {
          if (statusEl) {
            statusEl.textContent = steps[idx];
            statusEl.style.opacity = '1';
          }
        }, 300);
      }, 1200);
    })();

    function dismissLoader() {
      var loader = document.getElementById('loading-container');
      if (loader && loader.style.opacity !== '0') {
        loader.style.opacity = '0';
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }

    // 1. Listen for first frame event if dispatched
    window.addEventListener('flutter-first-frame', dismissLoader);

    // 2. MutationObserver: Watch for Flutter attaching view or canvas elements to DOM
    var observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-renderer')) {
        dismissLoader();
        observer.disconnect();
      }
    });
    if (document.body) {
      observer.observe(document.body, { childList: true, subtree: true });
    }

    // 3. Fallback safety timer: dismiss after 2.5 seconds maximum so the app NEVER hangs
    setTimeout(dismissLoader, 2500);

    // 4. Force unregister any legacy Service Workers & purge CacheStorage to prevent stale bundles
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=202609142130" async></script>
</body>
</html>
