version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supplychainx-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=SupplyChainX
      - VERSION=1.0.0
      - API_V1_STR=/api/v1
      - DATABASE_URL=sqlite:////app/backend/supplychainx.db
    volumes:
      - ./backend/supplychainx.db:/app/backend/supplychainx.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
